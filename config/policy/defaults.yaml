# CareerOS policy defaults (non-personal). Personal values (state, pay floor, cities, restricted employers)
# live in the vault: <vault>/policy/overrides.yaml, merged over this file. Every gate/score result records the
# merged policy fingerprint, so any change here is traceable.
policy_version: phase1-1

families:
  # Checked in this order; first match wins (most specific first).
  power_platform_automation:
    label: Power Platform / automation
    title_any: [power platform, power apps, powerapps, power automate, automation analyst, automation specialist,
                automation developer, rpa, low-code, low code, process automation, intelligent automation,
                workflow automation, business automation]
  healthcare_bsa:
    label: Business systems analyst (healthcare preferred)
    title_any: [business systems analyst, systems analyst, business analyst, bsa, claims analyst, edi analyst,
                configuration analyst, benefits configuration, pharmacy benefit analyst, technical business analyst,
                business system analyst, functional analyst, application analyst, applications analyst,
                application support analyst, uat analyst, uat, testing analyst, test analyst, requirements analyst]
  pbm_claims_operations:
    label: PBM / claims / benefits operations
    # Added 2026-10-10 after a title audit found relevant remote PBM/payer roles rejected by the early screen.
    title_any: [pbm, pharmacy benefit, pharmacy operations, pharmacy programs, pharmacy analyst, claims analyst,
                claim analyst, claims specialist, claims operations, claims auditor, payment integrity,
                coordination of benefits, cob specialist, benefit configuration, benefits configuration,
                benefit plan configuration, plan build, plan configuration, benefit operations, eligibility analyst,
                data exchange, formulary, rebate analyst, accumulations, implementation analyst,
                implementation specialist, integration analyst, healthcare analyst, health care analyst,
                clinical programs administration, encounter data, credentialing quality,
                claims quality, claims audit, claims configuration, reimbursement analyst, provider operations analyst,
                provider data analyst, network operations analyst, pharmacy network, eligibility configuration,
                enrollment analyst,
                # 2026-10-12 title audit (user-approved): adjacent remote roles no family covered
                provider data operations, provider data specialist, provider operations specialist,
                payer integration, claims product owner, product owner claims, special investigations, siu analyst,
                siu investigator, fraud waste and abuse, fwa analyst, risk adjustment auditor]
  data_reporting:
    label: Data / reporting analyst
    title_any: [reporting analyst, report analyst, data analyst, business intelligence, bi analyst, analytics analyst,
                power bi, data quality analyst, data analytics, business insights, data operations analyst,
                data validation analyst, data integrity analyst, data governance analyst, data reconciliation analyst,
                quality analyst, quality assurance analyst, audit analyst]
  process_analyst:
    label: Business process analyst
    title_any: [process analyst, business process, process improvement, process optimization, operations analyst,
                process excellence, continuous improvement analyst, workflow analyst, operational excellence,
                implementation consultant,
                implementation manager]   # 2026-10-12: an individual-contributor role (see seniority _IC_MANAGER)

# Second review of title-screen rejects (2026-10-12, Part 3). Deterministic, no model calls. A title that matched no
# family but holds an ambiguous role word is rescued only with strong evidence from the posting itself; every decision
# is recorded with its evidence. Rescues are capped per run so the review queue never floods.
title_rescue:
  enabled: true
  max_rescues_per_run: 10
  max_rescue_reviews_per_run: 200     # earlier rejects re-queued for a second look per run
  ambiguous_title_terms: [operations, member, workforce, quality, specialist, coordinator, associate, analyst,
                          representative, reviewer, auditor, administrator]
  context_terms: [claims, claim adjudication, adjudication, pharmacy benefit, pbm, rxclaim, eligibility, enrollment,
                  prior authorization, payer, reimbursement, benefits administration, coordination of benefits, formulary,
                  encounter data, provider data, health plan, medicare, medicaid, payment integrity, reconciliation,
                  claims processing, explanation of benefits, accumulator, ncpdp, "837", "835", "834"]
  department_terms: [claims, pharmacy, pbm, operations, member, payer, benefits, eligibility, revenue cycle, quality,
                     payment integrity, enrollment, network, provider]
  data_terms: [reporting, dashboards, data validation, data quality, sql, analytics, metrics]
  rescue_family: pbm_claims_operations
  skip_title_terms: [business development, partnerships, partnership, sales, account executive, marketing]
  reject_signals:
    software_qa: [selenium, cypress, test automation, automated testing, unit tests, sdet, qa engineer, regression suite,
                  playwright, appium]
    clinical: [registered nurse, rn license, licensed practical nurse, lpn, bsn, nurse practitioner, clinical judgment,
               direct patient care, pharmacist license, licensed clinical]
    contact_center_quality: [call monitoring, monitor calls, call quality, call center quality, contact center quality,
                             agent scorecards, coaching agents]
    sales: [sales quota, quota attainment, prospecting, cold calling]

# Employer name -> parent company (caps, D13 holds, familiarity). Matched case-insensitively. Families tied to the job
# seeker's own situation are added in the vault overrides (refactor R4).
parents:
  CVS Health: [cvs, cvs health, caremark, cvs caremark, aetna, signify health]
  The Cigna Group: [cigna, evernorth, express scripts, accredo]
  Elevance Health: [elevance, anthem, carelon, carelonrx]
  Humana: [humana, centerwell]
  Capital Rx: [judi health, capital rx]

# "principal" is NOT here (2026-10-12): it is a seniority level (below) and the gate's principal_scope rule.
title_exclude: [director, vice president, vp, svp, evp, avp, chief, head of, intern, internship, apprentice, sales,
                account executive, account manager, recruiter, nurse, physician, pharmacist, therapist,
                software engineer, data engineer, machine learning, scientist, attorney, counsel, professor,
                medical coder, coding specialist, new grad, new graduate, graduate program, campus,
                early career program, 2027 start]

seniority_terms:
  entry: [junior, jr, entry level, associate, analyst i, apprentice]
  mid: [analyst ii, intermediate]
  senior: [senior, sr, analyst iii, lead, staff]
  principal: [principal]
  manager: [manager, supervisor]

gate:
  require_us: true
  # Years (prompts v2.1, 2026-10-12): up to years_minor_gap short = moderate penalty; more = major penalty; more than
  # years_major_gap short on a clearly REQUIRED number = rejected. Preferred years only ever lower the score.
  years_minor_gap: 2
  years_major_gap: 4
  max_seniority_gap: 2        # levels: entry 1, mid 2, senior 3, manager 5; manager roles fail for entry/mid profiles
  employment_types_allowed: [full_time, contract, contract_to_hire, temporary, unknown]
  scam_block_terms: [wire transfer, gift card, check deposit, purchase equipment, send your bank,
                     social security number, telegram, whatsapp interview, signal app, crypto payment,
                     processing fee, training fee]
  held_parents: []            # set in vault overrides (D13)
  # 2026-10-12 decision: a required bachelor's degree does not reject a PBM product role; it becomes a STRETCH
  # (kept, flagged "Stretch", never Tier A/B). PBM context = domain_levels.direct (PBM, pharmacy benefit, RxClaim).
  degree_stretch:
    title_terms: [product manager, product owner, product analyst, product lead, product specialist]
    domain_levels: [direct]
  # "Principal" titles (2026-10-12): evaluated on their actual requirements. Rejected only when the posting also asks
  # for people leadership, or for strategic/architecture ownership (two or more distinct terms below); one strategy
  # term is a flag for you to read. Years are judged by the normal years rule (e.g. 10+ required = far short).
  principal_scope:
    leadership_terms: [direct reports, manage a team, managing a team, people management, people manager, people leader,
                       lead a team of, leading a team of, supervise a team, supervising a team, build and lead a team]
    strategy_terms: [enterprise architecture, architecture strategy, architectural strategy, own the architecture,
                     architectural ownership, set the strategy, define the strategy, own the strategy, strategic direction,
                     enterprise strategy, organizational strategy, multi year roadmap, transformation strategy,
                     executive leadership team, enterprise wide strategy]
  excluded_employers: []      # set in vault overrides; permanent, private reasons; rejected everywhere, never recommended

extraction:
  min_confidence: 0.6
  min_requirements: 2         # fewer than this from a long posting => needs review
  ai:
    enabled: true             # active only when an API key is stored (Credential Manager "CareerOS/anthropic")
    model: claude-opus-5-5    # Claude Haiku 5.5 (claude-haiku-5-5) is much cheaper for bulk reading, if you choose it
    effort: medium
    max_calls_per_day: 100    # only postings that pass the early title/US/remote screen are read

weights:
  eligibility:      {skills_coverage: 30, functional_experience: 25, years_seniority: 15, education_certification: 10, location_authorization: 10, employment_schedule: 10}
  candidate_fit:    {functional_overlap: 25, domain_overlap: 20, tools_overlap: 15, evidence_strength: 10, seniority_alignment: 10, transferable_quality: 10, employer_familiarity: 5, stakeholder_process: 5}
  career_value:     {compensation: 25, progression: 20, stability: 15, location: 10, skill_growth: 15, domain_relevance: 15}
  priority:         {candidate_fit: 0.65, career_value: 0.25, freshness: 0.10}

tiers:                      # prompts v2.2: Tier A/B need state ELIGIBLE (and the skill minimum below)
  A: {priority: 92}
  B: {priority: 85}
  conditional: {priority: 85} # CONDITIONAL jobs at or above this are listed as "Conditional priority"
  near_miss: {priority: 78}
  skill_coverage_min: 0.7     # 2026-10-12 decision: Tier A/B also need >= 70% of required skills (evidence-weighted)

freshness:
  - {max_days: 1, score: 100}
  - {max_days: 3, score: 80}
  - {max_days: 7, score: 60}
  - {max_days: 14, score: 45}
  - {max_days: 30, score: 30}
  - {max_days: 100000, score: 15}
freshness_unknown: 50

# NIGHT / overnight profile (prompts v2.1): judged and ranked separately from PRIMARY; never changes PRIMARY results.
# Off until you approve its pay settings in vault overrides (night: {enabled: true, compensation: {...}}).
night:
  enabled: false
  # Prompts v2.2: every NIGHT posting gets exactly one mode (your rule, 2026-10-12): full-time / contract / contract-
  # to-hire on a true overnight or third shift = REPLACEMENT; everything else (part-time, evening, weekend, flexible,
  # unknown hours) = SUPPLEMENTAL. Each mode has its own pay settings, weights and leaderboard. Unset pay = flagged,
  # never rejected. Set your values in vault overrides, then `enabled: true`.
  modes:
    supplemental:
      compensation: {floor_hourly: null, target_hourly: null}
      weights: {schedule: 30, compensation: 25, candidate_fit: 15, low_phone_stress: 15, stability: 5, freshness: 10}
      schedule_value: {evening: 1.0, weekend: 1.0, flexible: 1.0, overnight: 0.8, unknown: 0.4, daytime_likely: 0.2}
    replacement:
      compensation: {floor_annual: null, target_annual: null}
      weights: {schedule: 15, compensation: 25, candidate_fit: 25, low_phone_stress: 10, stability: 15, freshness: 10}
      schedule_value: {overnight: 1.0, evening: 0.7, flexible: 0.6, weekend: 0.5, unknown: 0.4, daytime_likely: 0.2}
  replacement_employment: [full_time, contract, contract_to_hire]
  employment_types_allowed: [full_time, part_time, contract, contract_to_hire, temporary, unknown]
  tiers: {A: 90, B: 82, conditional: 82, near_miss: 65}   # A/B need state ELIGIBLE
  # CONDITIONAL triggers on top of the PRIMARY material unknowns: hours not stated, and a concrete reason for a
  # conflict-of-interest review with a daytime job (Supplemental only). Same-industry overlap alone
  # (night_industry_overlap) is informational and never makes a job CONDITIONAL. An unset NIGHT pay floor is a
  # settings gap, not a job unknown.
  material_unknowns_extra: [schedule_unknown, night_coi_review, daytime_hours_likely]
  # Your daytime job's hours, for Supplemental workload sustainability and overlap (2026-10-12). Unset = workload
  # "unknown". Set in vault overrides, e.g. day_job: {start: "08:00", end: "16:30", days: [mon, tue, wed, thu, fri]}
  day_job: {start: null, end: null, days: [mon, tue, wed, thu, fri]}
  # Workload (informational, never a rejection): severe = 14+ working hours a day or under 6 hours' longest rest;
  # caution = over 12 hours or under 8 hours' rest; green otherwise. Stated hours that OVERLAP the day job make the
  # job incompatible with Supplemental (it cannot sit alongside the day job).
  workload: {caution_total_hours: 12, severe_total_hours: 14, caution_min_rest_hours: 8, severe_min_rest_hours: 6}
  # Conflict-of-interest review (Supplemental). Concrete reasons make it manual_coi_review_required (CONDITIONAL):
  # same employer family (familiar employers, held parents), the lists below (private: set them in vault overrides),
  # an employment agreement that restricts outside work, posting text that forbids other employment, overlapping
  # hours, or an existing application through another channel. Same industry alone = industry_overlap (informational).
  coi:
    clients_vendors: []
    competitors: []
    agreement_restricts_outside_work: false
    posting_terms: [no outside employment, no secondary employment, no other employment, exclusive employment,
                    moonlighting is not permitted, moonlighting is prohibited, may not hold other employment,
                    must not hold other employment, not permitted to hold other employment, sole employment]
  title_exclude_extra: []
  families:   # checked in this order; first match wins
    quality_audit: [quality analyst, quality auditor, quality assurance, quality specialist, quality monitoring,
                    quality reviewer, qa specialist, qa analyst, audit specialist, auditor, claims quality]
    claims_operations: [claims processor, claims examiner, claims specialist, claims analyst, claims representative,
                        claims associate, claims coordinator, adjudicator, adjudication specialist, pharmacy claims]
    workforce_monitoring: [workforce, wfm, real time analyst, rta, scheduling analyst, command center,
                           operations center, monitoring analyst, monitoring specialist, incident, traffic analyst,
                           noc technician, noc analyst, network operations center, operations monitor, systems monitor]
    content_review: [content moderator, content moderation, content reviewer, content review, trust and safety,
                     community moderator, data annotator, data annotation, data labeling, annotation specialist,
                     search quality rater, ad quality rater, rater]
    reporting_data: [reporting analyst, report analyst, data analyst, data specialist, data entry, data validation]
    back_office_operations: [operations specialist, operations coordinator, operations associate, operations analyst,
                             back office, processing specialist, case processor, document processing, enrollment specialist,
                             eligibility specialist, billing specialist, payment posting, reconciliation specialist,
                             prior authorization specialist, benefits specialist, order processing, order processor,
                             claims entry, transcription, transcriptionist, night auditor, overnight auditor]
    support: [customer service, member services, customer support, help desk, technical support, support specialist,
              call center, contact center, customer care]
  # How CareerOS reads a posting's hours (expanded 2026-10-12 at your request). Evidence is taken in this order:
  # 1. the job TITLE: bare words count there ("Overnight Claims Processor", "3rd Shift Data Entry", "Afterhours ...");
  # 2. schedule PHRASES in the posting ("overnight shift", "graveyard", "after-hours support"...): bare words in the body
  #    ("change doesn't happen overnight", "asynchronous training") describe the company, not the hours, so they don't;
  # 3. the HOURS themselves: "10:00 PM - 6:30 AM", "11p-7a", "2300-0730" = overnight; "3 PM - 11:30 PM" = evening;
  #    "8 AM - 5 PM" = daytime.
  # A phrase that is negated ("no nights or weekends") or incidental ("occasional after-hours work as needed") never
  # counts. Hyphens and spaces are interchangeable ("after-hours" = "after hours"); "afterhours" is listed separately.
  schedule:
    title_terms:
      overnight: [overnight, overnights, night, nights, nightshift, night shift, graveyard, third shift, 3rd shift,
                  midnight, late night, nocturnal]
      evening: [evening, evenings, second shift, 2nd shift, swing, swing shift, pm shift, late shift, after hours,
                afterhours, closing shift]
      weekend: [weekend, weekends, baylor, weekend warrior]
      flexible: [flexible hours, flexible schedule]
    overnight: [overnight shift, overnight shifts, overnight hours, overnight schedule, overnight role, overnight position,
                overnight team, overnight coverage, overnight support, overnight operations, overnight availability,
                overnight work, work overnight, working overnight, overnights, overnight only,
                night shift, night shifts, nightshift, nights only, night hours, night schedule, night team, night crew,
                night coverage, night role, night position, work nights, working nights, permanent nights,
                graveyard, graveyard shift, third shift, 3rd shift, shift 3, midnight shift, midnight to, late night shift,
                11pm to, 11 pm to, 10pm to, 10 pm to, 12am to, 12 am to, 9pm to, 9 pm to]
    evening: [evening shift, evening shifts, evening hours, evening schedule, evening role, evening team, evening coverage,
              work evenings, evenings only, second shift, 2nd shift, shift 2, swing shift, swing shifts, pm shift, pm shifts,
              late shift, late shifts, closing shift, after hours shift, after hours support, after hours coverage,
              after hours team, after hours role, after hours position, after hours schedule, afterhours,
              outside business hours, outside normal business hours, non business hours]
    weekend: [weekend shift, weekend shifts, weekends only, weekend schedule, weekend hours, weekend role, weekend position,
              weekend coverage, weekend team, weekend availability required, saturday and sunday shifts, saturday and sunday,
              friday through sunday, friday to sunday, baylor shift, baylor program, weekend option, weekend warrior]
    flexible: [flexible schedule, flexible hours, set your own schedule, set your own hours, choose your hours,
               choose your own hours, choose your own schedule, flexible shifts, flexible working hours, work when you want,
               self scheduled, self scheduling, pick your shifts, pick your own shifts]
    # Explicit day-shift wording rejects for NIGHT. Clock times are read by the hours reader instead, which tells the
    # role's hours ("Your schedule: 8 AM - 5 PM" = daytime) from business/training hours (= daytime_likely, CONDITIONAL).
    daytime_only: [day shift, day shifts, days only, first shift, 1st shift]
    daytime_likely: [standard business hours, normal business hours, regular business hours, business hours only]
    incidental: [occasional, occasionally, sometimes, periodic, periodically, as needed, if needed, when needed,
                 on call, on an as needed basis, may be required, may require, may include, some]
  phone_heavy: [inbound calls, outbound calls, high call volume, call center, contact center, phone based, answering calls,
                take calls, handle calls, phone support, telephone support]
  low_phone: [back office, non phone, no phone, chat support, email support, written communication, data entry,
              quality review, audit, reporting, documentation]
  stress_terms: [fast paced, high volume, quotas, quota, strict metrics, productivity targets, average handle time]

