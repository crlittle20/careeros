  payer: {value: 0.8, terms: [payer, health plan, managed care, medicare, medicaid, payment integrity, coordination of benefits,
                              health insurance, claims adjudication, benefits administration, medical claims]}
  healthcare: {value: 0.6, terms: [healthcare, health care, hospital, clinical, patient, pharmacy, health system, digital health]}
