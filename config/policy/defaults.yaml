# Weighted required-skill coverage (2026-10-12), used by the 70% Tier A/B minimum. Each REQUIRED skill (and each
# required domain) gets an importance weight; coverage = sum(weight x evidence) / sum(weight). Evidence: direct 1.0,
# strongly transferable 0.7, adjacent 0.4, none 0. Education, work authorization, clearance, licences and
# certifications are never skills here (the gate judges them). Every item, its weight, the reason for the weight and
# the evidence found are stored with the score.
skill_importance:
  weights: {core: 4, important: 2, supporting: 1, generic: 0.5}
  default: important              # a listed skill not named below
  core: [rxclaim, claims validation, reconciliation, data validation, x12 edi, ncpdp, facets, qnxt]   # central domain work
  supporting: [jira, confluence, tableau, power bi, visio, sharepoint, servicenow, azure devops, python, zapier,
               salesforce, power apps, power automate, power platform, dataverse, copilot, rpa]      # workflow tools
  generic: [agile, documentation]  # generic competencies
  required_domains: core           # a required domain (PBM, claims, healthcare) is central to the role
  min_weight_to_judge: 2           # fewer importance points than this (e.g. only Agile + documentation) = too few to judge
  # Promotions: named in the job title = core; also one of the role's stated duties = one level up.

