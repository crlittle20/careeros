# Board scanning health (2026-10-12, Part 8). Never changes a decision, so it is outside the decision fingerprint.
scanning:
  adaptive: false                     # true = quiet boards are scanned weekly / monthly; preview: `careeros sources health`
  close_after_missed_scans: 2         # a posting closes only after this many complete scans without it
  suspicious_drop_ratio: 0.4          # a scan with under 40% of last time's postings (or none) is suspicious: nothing closes
  restricted_disable_after: 3         # 401/403 this many scans in a row: the board is disabled (only then)
  # 2026-10-13: cadence follows the employer's career fit (A/B/C/dormant), never its board trust
  priority_cadence: {A: daily, B: every_3_days, C: weekly, dormant: weekly}
  new_board_days: 14                  # a newly admitted board is scanned daily while CareerOS learns it
  monthly_after_days: 120             # dormant, no relevant role ever, older than this: monthly
  provider_degraded_min_failures: 3   # this many boards of one provider failing together (and >= the ratio below)
  provider_degraded_ratio: 0.5        #   = a provider / adapter problem: no employer is penalised
  failures_before_reverify: 3         # this many failed scans of one board in a row: re-check it at the employer's site

# Board verification (2026-10-13): CareerOS trusts the employer's own website first and the ATS second. A board joins
# the daily scan only when the employer's official site links to it (handshake), the board agrees about who it belongs
# to (identity), Board Trust >= 85, and a validation scan passes. Boards scanned before this existed keep being scanned
# while they are re-verified (legacy grace) unless a concrete failure pauses them.
board_verification:
  enforce: true                       # false = the old behaviour (every listed board scanned); for emergencies only
  fetch_official_sites: false         # true = CareerOS may read employer homepages / careers pages (safe fetcher,
                                      #   robots.txt honoured, <= daily_site_requests a day). Your decision.
  daily_site_requests: 40
  ats_request_budget: 40              # listing-API requests for verification and validation scans per run
  max_pages_per_employer: 8
  max_verifications_per_run: 5        # new candidate boards checked per daily run
  max_reverifications_per_run: 5      # boards due for re-verification (and legacy boards) per daily run
  max_validations_per_run: 10
  max_boards_per_employer: 3          # boards evaluated when an employer's site links to several
  auto_trust: 85                      # Board Trust needed for automatic scanning (plus every mandatory rule)
  review_trust: 65                    # 65-84 = your review; below = never admitted
  override_days: 90                   # a manual approval expires after this many days
  reverify_days: {new: 7, stable: 45, long_term: 90}
  candidate_retry_days: 30            # an unproven candidate is checked again after this
  site_failures_before_review: 3      # official site unreadable this many times in a row: asks for your review
  legacy_grace_days: null             # null = legacy boards keep being scanned until verified or failed

# Verified employer-board discovery (2026-10-12, Parts 1, 2, 9). OFF in the daily run until you switch it on; the
# `careeros sources ...` commands work on demand. Only the four allowed ATS listing APIs are ever called.
source_discovery:
  enabled: false                      # true = the daily run also discovers boards for new leads (within the budget)
  auto_activate: false                # true = a verified board with relevant roles joins the daily scan by itself
  slug_guessing: true                 # bounded: distinctive full-name variants only, never generic or shortened names
  max_slug_variants: 2
  daily_request_budget: 60            # every request counts: metadata, retries and redirects included
  per_provider_budget: 20
  curated_share: 0.2                  # at most this share of the budget for curated (independently found) employers
  lookback_days: 90                   # historical backfill window
  closed_after_days: 45               # an unmatched lead older than this is treated as a closed historical opening
  retry_days: {slug_absent: 60, board_empty: 14, identity_unresolved: 30, no_qualified_roles: 30, access_restricted: 90,
               request_failed: 1, budget_exhausted: 0}
  staffing_agencies: [teksystems, insight global, randstad, kforce, apex systems, aerotek, adecco, manpower,
                      kelly services, beacon hill, collabera, cybercoders, motion recruitment, actalent, judge group, vaco,
                      addison group, experis, hays, spherion, jobot, medix, solomon page, talentburst, mindlance]
  pilot:
    start: null                       # set a date to start the 60-day pilot window
    days: 60
    targets: {new_apply_worthy_per_30_days: 5, audited_match_accuracy: 0.95, wrong_employer_admissions: 0,
              extra_review_minutes_per_week: 15}

operations:               # how CareerOS runs, never what it decides: changing these does not re-evaluate any job
  notifications: true     # Windows notification after the daily run when there is something new worth a look
  backup_keep: 14         # daily backups kept in vault/backups
  # Gmail search for job-alert emails (only used once you run `careeros gmail connect`). Senders only, so recruiter
  # and personal mail is never read; label any other alert email "CareerOS" in Gmail to include it.
  # LinkedIn sends application updates from the same jobs-noreply address, so application/interview subjects are
  # excluded here and again by subject after reading (careeros.discovery.alerts.is_correspondence).
  gmail_query: "newer_than:3d {from:(jobalerts-noreply OR jobs-noreply OR indeed.com OR glassdoor.com OR ziprecruiter.com OR usajobs.gov) label:careeros} -subject:(\"your application\" OR \"application was sent\" OR \"thank you for applying\" OR \"applied to\" OR interview OR assessment OR offer)"
  # Private GitHub repo (owner/name) where job recommendations arrive as issues, e.g. from a ChatGPT scheduled task.
  # Set it in vault overrides; null = off.
  github_inbox: null
  # Prompts v2.5: after each run, publish the sanitized seen-jobs index (job facts only) and the Gmail intake status
  # to that repo, so ChatGPT can skip jobs CareerOS already has. A local copy is kept in vault\reports\inbox-index.
  publish_seen_index: true
  seen_index_max_per_file: 1500   # past this many jobs the index is split into 16 shard files
