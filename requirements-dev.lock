# Development and CI tools (ruff, mypy, pip-audit) with the engine's dependencies, for tools/validate.py and CI.
# Locked 2026-10-13 (Portfolio Prompt 10). Every file: a wheel (no source builds), its sha256 equal to PyPI's, from a
# release at least 14 days old that is not yanked. Windows wheels were downloaded and hashed here; the Linux x86_64
# hashes are PyPI's for the same releases. pydantic is 2.13.5 here (2.14.0 in requirements.lock was 4 days old).
#   python -m venv .venv-dev
#   .venv-dev\Scripts\python.exe -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.lock
# Change it only the same way: pinned versions, verified hashes, and the 14-day rule for every package.
# One exception, approved by the owner 2026-10-20: certifi 2026.10.19 (published 2026-10-20) fixes GHSA-6q48-6c7w-9gw2 /
# PYSEC-2026-4320 (Critical: compromised eMudhra intermediates under emSign ECC Root CA - G3); its wheel's sha256 matched
# PyPI's own file listing and the downloaded file. A second exception, approved by the owner 2026-10-23: filelock
# 4.2.1 (published 2026-10-17) fixes CVE-2026-112907, CVE-2026-112913 and CVE-2026-112940 (published 2026-10-23, in
# 4.0.6, used here by pip-audit's cache); one universal wheel with no dependencies, its sha256 matched PyPI's own file
# listing and the downloaded file. Every other package still follows the 14-day rule.
# 2026-10-29: msgpack 1.2.2 -> 1.2.3 (published 2026-09-29, so within the 14-day rule; no exception) fixes
# GHSA-j586-36cw-2gc2 / CVE-2026-114613 (High: a C-extension memory leak on rejected map keys; used here by pip-audit's
# cache). Both sha256 values are PyPI's, and the public repository's CI installed both wheels with --require-hashes
# on 2026-10-29 (run 40821349712). A .venv-dev installed before this keeps 1.2.2 until it is reinstalled from this file.
# 2026-11-03 (the Python 3.14 batch, D81): PyYAML 6.0.2 -> 6.0.3 (published 2025-09-25), the first with CPython 3.14
# wheels; and each compiled package's CPython 3.14 wheels added for Windows x64 and Linux x86_64 (charset-normalizer,
# jiter, librt, msgpack, mypy, pydantic_core, PyYAML, tomli: 18 hashes, PyPI's, every file uploaded at least 14 days
# before). Every pin and every 3.12 hash is kept, so a 3.12 environment still installs from this file.
# 2026-11-03 (OPP-71, D83): pydantic 2.13.5 -> 2.14.0 and pydantic_core 2.46.5 -> 2.50.0 (both 2026-10-08), the
# runtime lock's versions, so the development set now holds the runtime set exactly.
